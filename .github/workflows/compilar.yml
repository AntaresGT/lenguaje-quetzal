name: Compilar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Los jobs no se esperan entre sí: Windows, Ubuntu, el binario musl,
# Fedora y Arch arrancan a la vez. Fedora y Arch no tienen runner
# oficial; corren en contenedor sobre ubuntu-latest.
jobs:
  anfitrion:
    name: Compilar (${{ matrix.sistema }})
    runs-on: ${{ matrix.corredor }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows
            corredor: windows-latest
            binario: quetzal.exe
            binario_lsp: quetzal-lsp.exe
            artefacto: quetzal-windows
            empaquetado: windows
            objetivo: ""
            # CRT de MSVC dentro del .exe: el usuario no instala VC++ Redistributable.
            rustflags: "-C target-feature=+crt-static"
          - sistema: ubuntu
            corredor: ubuntu-latest
            binario: quetzal
            binario_lsp: quetzal-lsp
            artefacto: quetzal-ubuntu
            empaquetado: deb
            objetivo: ""
            rustflags: ""
          - sistema: linux
            corredor: ubuntu-latest
            binario: quetzal
            binario_lsp: quetzal-lsp
            artefacto: quetzal-linux
            empaquetado: estatico
            objetivo: x86_64-unknown-linux-musl
            # musl estático: un solo archivo, sin libc del sistema.
            # Corre en Ubuntu, Fedora, Arch y Alpine.
            rustflags: "-C target-feature=+crt-static"

    steps:
      - name: Instalar musl
        if: matrix.empaquetado == 'estatico'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Obtener código
        uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.objetivo }}

      - name: Cache de dependencias Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lnc-${{ matrix.sistema }}

      - name: Compilar ejecutables (release)
        if: matrix.objetivo == ''
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build -p lnc -p lsp --release

      - name: Compilar ejecutables estáticos (musl)
        if: matrix.objetivo != ''
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build -p lnc -p lsp --release --target ${{ matrix.objetivo }}

      - name: Instalar WiX
        if: matrix.empaquetado == 'windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Empaquetar Windows
        if: matrix.empaquetado == 'windows'
        shell: bash
        run: |
          mkdir -p dist/portable dist/instalador
          cp "target/release/${{ matrix.binario }}" "dist/portable/${{ matrix.binario }}"
          cp "target/release/${{ matrix.binario_lsp }}" "dist/portable/${{ matrix.binario_lsp }}"
          bash .github/scripts/empaquetar-msi.sh "dist/portable/${{ matrix.binario }}" dist/instalador

      - name: Instalar dpkg-dev
        if: matrix.empaquetado == 'deb'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Empaquetar .deb
        if: matrix.empaquetado == 'deb'
        shell: bash
        run: bash .github/scripts/empaquetar-deb.sh "target/release/${{ matrix.binario }}" dist/paquete

      - name: Empaquetar binarios estáticos
        if: matrix.empaquetado == 'estatico'
        shell: bash
        run: |
          set -euo pipefail
          for nombre in "${{ matrix.binario }}" "${{ matrix.binario_lsp }}"; do
            bin="target/${{ matrix.objetivo }}/release/$nombre"
            if readelf -d "$bin" 2>/dev/null | grep -q '(NEEDED)'; then
              echo "el binario musl $nombre sigue enlazado a librerías dinámicas" >&2
              readelf -d "$bin" || true
              exit 1
            fi
          done
          mkdir -p dist/portable
          cp "target/${{ matrix.objetivo }}/release/${{ matrix.binario }}" "dist/portable/${{ matrix.binario }}"
          cp "target/${{ matrix.objetivo }}/release/${{ matrix.binario_lsp }}" "dist/portable/${{ matrix.binario_lsp }}"

      - name: Empaquetar AppImage
        if: matrix.empaquetado == 'estatico'
        shell: bash
        run: |
          mkdir -p dist/appimage
          bash .github/scripts/empaquetar-appimage.sh "dist/portable/${{ matrix.binario }}" dist/appimage

      # Actions ya comprime cada subida. Un zip dentro de dist/ saldría
      # otra vez al extraer el artefacto.
      - name: Subir binarios portátiles
        if: matrix.empaquetado == 'windows' || matrix.empaquetado == 'estatico'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/portable/*
          if-no-files-found: error
          retention-days: 5

      - name: Subir instalador MSI
        if: matrix.empaquetado == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: quetzal-windows-msi
          path: dist/instalador/*
          if-no-files-found: error
          retention-days: 5

      - name: Subir paquete Debian
        if: matrix.empaquetado == 'deb'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/paquete/*
          if-no-files-found: error
          retention-days: 5

      - name: Subir AppImage
        if: matrix.empaquetado == 'estatico'
        uses: actions/upload-artifact@v4
        with:
          name: quetzal-appimage
          path: dist/appimage/*
          if-no-files-found: error
          retention-days: 5

  distro:
    name: Compilar (${{ matrix.sistema }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.imagen }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: fedora
            imagen: fedora:latest
            artefacto: quetzal-fedora
            empaquetado: rpm
            paquetes: dnf install -y gcc git curl ca-certificates binutils findutils rpm-build
          # Sin artefacto: el binario musl de quetzal-linux ya corre en Arch.
          - sistema: arch
            imagen: archlinux:latest
            empaquetado: compilar
            paquetes: |
              pacman -Sy --noconfirm archlinux-keyring
              pacman -S --noconfirm --needed base-devel git curl ca-certificates binutils findutils

    steps:
      # git tiene que existir antes de checkout: si no, Actions baja un
      # tarball y el clon no trae .git.
      - name: Instalar toolchain de la distro
        run: ${{ matrix.paquetes }}

      - name: Obtener código
        uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lnc-${{ matrix.sistema }}

      - name: Compilar ejecutables (release)
        run: cargo build -p lnc -p lsp --release

      - name: Empaquetar RPM
        if: matrix.empaquetado == 'rpm'
        shell: bash
        run: bash .github/scripts/empaquetar-rpm.sh target/release/quetzal dist/paquete

      - name: Subir RPM
        if: matrix.empaquetado == 'rpm'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/paquete/*
          if-no-files-found: error
          retention-days: 5

  pruebas:
    name: Pruebas y cero unsafe
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pruebas

      - name: Prohibir unsafe_code
        env:
          RUSTFLAGS: "-Dunsafe_code"
        run: cargo check -p ast -p nucleo -p diagnosticos -p lexico -p sintaxis -p semantica -p bytecode -p maquina_virtual -p runtime -p modulos_nativos -p paquetes -p pruebas_bytecode -p pruebas_runtime -p pruebas_paquetes --tests --locked

      - name: Suite de pruebas
        run: cargo test --workspace --locked

      - name: cargo geiger (opcional, informativo)
        continue-on-error: true
        run: |
          if command -v cargo-geiger >/dev/null 2>&1; then
            cargo geiger --all-features
          else
            echo "cargo-geiger no está instalado; se omite (opcional)"
          fi
