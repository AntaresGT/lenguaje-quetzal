[package]
name = "lenguaje-quetzal"
version = "0.0.2"
edition = "2021"
authors = ["Allam López <alan@antaresgt.com>", "Antares <antaresgt.com>"]
build = "src/compilar.rs"
repository = "https://github.com/AntaresGT/lenguaje-quetzal"

[[bin]]
name = "quetzal"
path = "src/principal.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.winres]
OriginalFilename = "quetzal.exe"
LegalCopyright = "Derechos Reservados © 2026 - Antares"
ProductVersion = "0.0.2"

[dependencies]
anyhow = "1.0.100"
cap-std = "4.0.0"
clap = "4.5.54"
codespan-reporting = "0.13.1"
colored = "3.0.0"
dialoguer = "0.12.0"
logos = "0.16.0"
miette = "7.6.0"
moka = { version = "0.12.12", features = ["sync"] }
pest = "2.8.5"
pest_derive = "2.8.5"
rpassword = "7.4.0"
rust_decimal = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
unicode-ident = "1.0.22"
base64 = "0.22.0"
urlencoding = "2.1.3"
