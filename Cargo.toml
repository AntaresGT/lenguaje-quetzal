[package]
name = "lenguaje-quetzal"
version = "0.0.2"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
regex = "1.0"
base64 = "0.21"
urlencoding = "2.1"
rpassword = "7.0"
inquire = "0.7.5"
stacker = "0.1"
bumpalo = { version = "3.16", features = ["collections"] }

[[bin]]
name = "quetzal"
path = "src/principal.rs"
